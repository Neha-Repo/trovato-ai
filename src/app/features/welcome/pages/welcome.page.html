<ion-content [fullscreen]="true" class="welcome-page">
  <main class="welcome-container">
    <section class="welcome-hero">
      <div class="brand-lockup">
  <img
    src="assets/images/trovato-logo.png"
    alt="Trovato AI"
  />
</div>

      <h1>Spend your vacation exploring Italy.</h1>

      <p class="tagline">
        Tell us what you want to visit. We’ll help you find available tickets,
        better times, and alternatives.
      </p>
    </section>

    <section class="welcome-actions">
      <ion-button
        expand="block"
        class="trovato-button trovato-button--primary"
        (click)="startPlanning()"
      >
        Start planning
      </ion-button>
    </section>
  </main>
</ion-content>
