<ion-content [fullscreen]="true" class="chat-page">
  <main class="chat-container">
    @if (!hasConversation) {
      <header class="chat-header">
        <img
          src="assets/images/trovato-logo.png"
          alt="Trovato AI"
          class="chat-logo"
        />

        <p class="chat-kicker">Your cultural travel assistant</p>

        <h1>What would you like to explore in Italy?</h1>

        <p class="chat-intro">
          Tell us naturally. Add a place, date, group size, or type of experience.
        </p>
      </header>

      <section class="suggestions" aria-label="Suggested searches">
        <button
          type="button"
          (click)="selectSuggestion('I would like to explore museums in Italy')"
        >
          <span class="suggestion-icon" aria-hidden="true">🏛️</span>
          <span class="suggestion-label">Museums</span>
        </button>

        <button
          type="button"
          (click)="selectSuggestion('Show me art museums in Florence')"
        >
          <span class="suggestion-icon" aria-hidden="true">🎨</span>
          <span class="suggestion-label">Art</span>
        </button>

        <button
          type="button"
          (click)="selectSuggestion('Find wine tours in Tuscany')"
        >
          <span class="suggestion-icon" aria-hidden="true">🍷</span>
          <span class="suggestion-label">Wine tours</span>
        </button>

        <button
          type="button"
          (click)="selectSuggestion('Find football matches in Italy')"
        >
          <span class="suggestion-icon" aria-hidden="true">⚽</span>
          <span class="suggestion-label">Football</span>
        </button>
      </section>
    } @else {
      <section class="conversation" aria-live="polite">
        @for (message of messages; track message.id) {
          <article
            class="message"
            [class.message--user]="message.sender === 'user'"
            [class.message--assistant]="message.sender === 'assistant'"
          >
            <p>{{ message.text }}</p>
          </article>
        }
      </section>
    }

    <section class="chat-composer">
      <label for="travel-request" class="sr-only">
        Describe what you want to explore
      </label>

      <textarea
        id="travel-request"
        rows="3"
        placeholder="Ask Trovato AI anything..."
        [(ngModel)]="userInput"
      ></textarea>

      <button
        type="button"
        class="send-button"
        (click)="sendMessage()"
      >
        Send
      </button>
    </section>
  </main>
</ion-content>
